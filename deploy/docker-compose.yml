services:
  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/executor
    ports:
      - "${EXECUTOR_PORT:-8081}:8081"
    environment:
      EXECUTOR_PORT: 8081
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SESSION_DIR: /data/sessions
      PI_BIN: ${PI_BIN:-pi}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-600000}
      # Executor runtime:
      #   json = one pi process per message (proven, the fallback)
      #   rpc  = one long-lived pi child per session: steer, abort, auto-retry
      EXECUTOR_MODE: ${EXECUTOR_MODE:-json}
      RPC_IDLE_TTL_MS: ${RPC_IDLE_TTL_MS:-300000}
      OPENSHELL_ENABLED: ${OPENSHELL_ENABLED:-false}
      OPENSHELL_PREFIX: ${OPENSHELL_PREFIX:-}
      # Per-session sandboxing (needs OPENSHELL_ENABLED=true). Image + policy
      # are baked/shipped, never secret; the provider key stays server-side.
      OPENSHELL_SANDBOX_IMAGE: ${OPENSHELL_SANDBOX_IMAGE:-pi-agent:local}
      OPENSHELL_POLICY: ${OPENSHELL_POLICY:-/openshell/policy.yaml}
      OPENSHELL_PROVIDER: ${OPENSHELL_PROVIDER:-}
      OPENSHELL_APPROVAL_MODE: ${OPENSHELL_APPROVAL_MODE:-manual}
      # SDK transport: how the executor reaches the OpenShell gateway API
      # from inside its container (host loopback is unreachable there, hence
      # host.docker.internal below). Certs have no SANs, so verification is
      # skipped for this loopback-adjacent control channel; client mTLS still
      # authenticates. See docs/roadmap.md NOW #1.
      OPENSHELL_SDK_GATEWAY: ${OPENSHELL_SDK_GATEWAY:-https://host.docker.internal:17670}
      OPENSHELL_SDK_INSECURE: ${OPENSHELL_SDK_INSECURE:-true}
      OPENSHELL_SDK_CLIENT_CERT_FILE: ${OPENSHELL_SDK_CLIENT_CERT_FILE:-/openshell-mtls/tls.crt}
      OPENSHELL_SDK_CLIENT_KEY_FILE: ${OPENSHELL_SDK_CLIENT_KEY_FILE:-/openshell-mtls/tls.key}
      OPENSHELL_SDK_CA_FILE: ${OPENSHELL_SDK_CA_FILE:-/openshell-mtls/ca.crt}
      OPENSHELL_SANDBOX_MAX_IDLE_MS: ${OPENSHELL_SANDBOX_MAX_IDLE_MS:-604800000}
      # No model keys here on purpose: pi authenticates from the executor host's
      # ~/.pi/agent/auth.json (see examples/models.md). Never bake keys into images.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - laun-data:/data
      # OpenShell gateway mTLS identity (read-only): the same triple the box
      # CLI uses. Mounted, never baked into the image.
      - /home/ubuntu/.config/openshell/gateways/openshell/mtls:/openshell-mtls:ro
      # pi's config + credentials. Two traps avoided deliberately:
      #  * the source must be the INVOKING USER's home — compose is started under
      #    sudo by deploy/bootstrap.sh, where HOME=/root would silently bind an
      #    empty /root/.pi instead of the operator's pi login;
      #  * it must be writable: pi creates ~/.pi/agent and refreshes model
      #    availability on every run. Confinement comes from OpenShell policy,
      #    not from this mount. See examples/models.md.
      - ${PI_CONFIG_DIR:-${HOME}/.pi}:/root/.pi
      # Give the agent a workspace that survives restarts. Mount your repos here:
      # - /srv/repos:/repos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8081/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      # Human-facing key for the CLI and browser UI. The gateway hashes it on
      # boot; it never reaches session files or logs.
      LAUN_KEY: ${LAUN_KEY:-}
      EXECUTOR_URL: http://executor:8081
      DATA_DIR: /data
    volumes:
      - laun-data:/data
    depends_on:
      executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/telegram-bridge
    environment:
      # Empty or placeholder = log one line and exit 0 (disabled-by-default).
      # Intentionally `:-`, not `:?`: a missing token must be a clean exit,
      # not a compose error, and `on-failure` below must not restart exit 0.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWLIST_IDS: ${TELEGRAM_ALLOWLIST_IDS:?set TELEGRAM_ALLOWLIST_IDS in .env}
      GATEWAY_URL: http://gateway:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      BRIDGE_POLL_MS: ${BRIDGE_POLL_MS:-2000}
    depends_on:
      gateway:
        condition: service_started
    # Restart on crashes, but NOT on a clean exit 0 (disabled-by-default).
    # `unless-stopped` would restart-loop a deliberately-disabled bridge.
    restart: on-failure

  # TLS front door (optional upgrade path; tunnel stays the default).
  # Uncomment to let Caddy terminate HTTPS and proxy ONLY the gateway.
  # Requires DOMAIN + ACME_EMAIL in .env; see deploy/tls.md. The executor
  # (:8081) has no route here and stays loopback-only.
  # caddy:
  #   image: caddy:2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     DOMAIN: ${DOMAIN:?set DOMAIN in .env to enable TLS}
  #     ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env to enable TLS}
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     gateway:
  #       condition: service_started
  #   restart: unless-stopped

volumes:
  laun-data:
