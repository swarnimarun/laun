services:
  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/executor
    ports:
      - "${EXECUTOR_PORT:-8081}:8081"
    environment:
      EXECUTOR_PORT: 8081
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SESSION_DIR: /data/sessions
      PI_BIN: ${PI_BIN:-pi}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-600000}
      # Executor runtime:
      #   json = one pi process per message (proven, the fallback)
      #   rpc  = one long-lived pi child per session: steer, abort, auto-retry
      EXECUTOR_MODE: ${EXECUTOR_MODE:-json}
      RPC_IDLE_TTL_MS: ${RPC_IDLE_TTL_MS:-300000}
      OPENSHELL_ENABLED: ${OPENSHELL_ENABLED:-false}
      OPENSHELL_PREFIX: ${OPENSHELL_PREFIX:-}
      # No model keys here on purpose: pi authenticates from the executor host's
      # ~/.pi/agent/auth.json (see examples/models.md). Never bake keys into images.
    volumes:
      - cloudbear-data:/data
      # pi's config + credentials. Two traps avoided deliberately:
      #  * the source must be the INVOKING USER's home — compose is started under
      #    sudo by deploy/bootstrap.sh, where HOME=/root would silently bind an
      #    empty /root/.pi instead of the operator's pi login;
      #  * it must be writable: pi creates ~/.pi/agent and refreshes model
      #    availability on every run. Confinement comes from OpenShell policy,
      #    not from this mount. See examples/models.md.
      - ${PI_CONFIG_DIR:-${HOME}/.pi}:/root/.pi
      # Give the agent a workspace that survives restarts. Mount your repos here:
      # - /srv/repos:/repos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8081/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      # Human-facing key for the CLI and browser UI. The gateway hashes it on
      # boot; it never reaches session files or logs.
      CLOUDBEAR_KEY: ${CLOUDBEAR_KEY:-}
      EXECUTOR_URL: http://executor:8081
      DATA_DIR: /data
    volumes:
      - cloudbear-data:/data
    depends_on:
      executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: apps/telegram-bridge
    environment:
      # Empty or placeholder = log one line and exit 0 (disabled-by-default).
      # Intentionally `:-`, not `:?`: a missing token must be a clean exit,
      # not a compose error, and `on-failure` below must not restart exit 0.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWLIST_IDS: ${TELEGRAM_ALLOWLIST_IDS:?set TELEGRAM_ALLOWLIST_IDS in .env}
      GATEWAY_URL: http://gateway:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      BRIDGE_POLL_MS: ${BRIDGE_POLL_MS:-2000}
    depends_on:
      gateway:
        condition: service_started
    # Restart on crashes, but NOT on a clean exit 0 (disabled-by-default).
    # `unless-stopped` would restart-loop a deliberately-disabled bridge.
    restart: on-failure

volumes:
  cloudbear-data:
