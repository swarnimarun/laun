# One comprehensive image for every service: either pulled from GHCR
# (LAUN_TAG=0.1.0) or built from this checkout (`up -d --build`). Both paths
# tag the same reference, so service config never changes between them.
# See docs/releases.md.
x-laun-image: &laun-image
  image: ${LAUN_IMAGE:-ghcr.io/swarnimarun/laun}:${LAUN_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  executor:
    <<: *laun-image
    command: ["bun", "apps/executor/src/index.ts"]
    ports:
      - "${EXECUTOR_PORT:-8081}:8081"
    environment:
      EXECUTOR_PORT: 8081
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SESSION_DIR: /data/sessions
      PI_BIN: ${PI_BIN:-pi}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-600000}
      # Executor runtime:
      #   json = one pi process per message (proven, the fallback)
      #   rpc  = one long-lived pi child per session: steer, abort, auto-retry
      EXECUTOR_MODE: ${EXECUTOR_MODE:-json}
      RPC_IDLE_TTL_MS: ${RPC_IDLE_TTL_MS:-300000}
      OPENSHELL_ENABLED: ${OPENSHELL_ENABLED:-false}
      OPENSHELL_PREFIX: ${OPENSHELL_PREFIX:-}
      # Per-session sandboxing (needs OPENSHELL_ENABLED=true). Image + policy
      # are baked/shipped, never secret; the provider key stays server-side.
      OPENSHELL_SANDBOX_IMAGE: ${OPENSHELL_SANDBOX_IMAGE:-ghcr.io/swarnimarun/laun-pi-agent:${LAUN_TAG:-latest}}
      OPENSHELL_POLICY: ${OPENSHELL_POLICY:-/openshell/policy.yaml}
      OPENSHELL_PROVIDER: ${OPENSHELL_PROVIDER:-}
      OPENSHELL_APPROVAL_MODE: ${OPENSHELL_APPROVAL_MODE:-manual}
      # SDK transport: how the executor reaches the OpenShell gateway API
      # from inside its container (host loopback is unreachable there). The
      # gateway cert carries SAN host.openshell.internal, so TLS verifies
      # properly via extra_hosts below; client mTLS (mounted triple) still
      # authenticates. Gateway binds 0.0.0.0 but stays firewalled + mTLS-gated.
      # Hardcoded, not env-driven: an env-driven URL rotted here across
      # redeploys (stale local .env shadowed every fix), breaking every
      # sandboxed run. Operator choices (provider, approval mode) stay in .env.
      OPENSHELL_SDK_GATEWAY: https://host.openshell.internal:17670
      OPENSHELL_SDK_INSECURE: "false"
      OPENSHELL_SDK_CLIENT_CERT_FILE: /openshell-mtls/tls.crt
      OPENSHELL_SDK_CLIENT_KEY_FILE: /openshell-mtls/tls.key
      OPENSHELL_SDK_CA_FILE: /openshell-mtls/ca.crt
      OPENSHELL_SANDBOX_MAX_IDLE_MS: ${OPENSHELL_SANDBOX_MAX_IDLE_MS:-604800000}
      # CLI identity for sandbox lifecycle (create/stop/start/delete): the box
      # CLI's gateway registration + mtls triple, read-only. Combined with the
      # endpoint/insecure envs below, `openshell` works with no other setup.
      # (The executor is already trusted with GATEWAY_TOKEN + pi auth.)
      OPENSHELL_GATEWAY_ENDPOINT: https://host.openshell.internal:17670
      OPENSHELL_GATEWAY_INSECURE: "false"
      # No model keys here on purpose: pi authenticates from the executor host's
      # ~/.pi/agent/auth.json (see examples/models.md). Never bake keys into images.
    extra_hosts:
      - "host.openshell.internal:host-gateway"
    volumes:
      - laun-data:/data
      # OpenShell gateway mTLS identity (read-only): the same triple the box
      # CLI uses. Mounted, never baked into the image.
      - /home/ubuntu/.config/openshell/gateways/openshell/mtls:/openshell-mtls:ro
      # CLI gateway identity for the endpoint override (the CLI derives its
      # config dir from the endpoint URL, not the registration name): the
      # box CLI's mtls triple as individual read-only file mounts. File (not
      # dir) mounts because nesting a mount inside another read-only mount
      # fails at container create time.
      - /home/ubuntu/.config/openshell/gateways/openshell/mtls/ca.crt:/root/.config/openshell/gateways/https___host.openshell.internal_17670/mtls/ca.crt:ro
      - /home/ubuntu/.config/openshell/gateways/openshell/mtls/tls.crt:/root/.config/openshell/gateways/https___host.openshell.internal_17670/mtls/tls.crt:ro
      - /home/ubuntu/.config/openshell/gateways/openshell/mtls/tls.key:/root/.config/openshell/gateways/https___host.openshell.internal_17670/mtls/tls.key:ro
      # pi's config + credentials. Two traps avoided deliberately:
      #  * the source must be the INVOKING USER's home — compose is started under
      #    sudo by deploy/bootstrap.sh, where HOME=/root would silently bind an
      #    empty /root/.pi instead of the operator's pi login;
      #  * it must be writable: pi creates ~/.pi/agent and refreshes model
      #    availability on every run. Confinement comes from OpenShell policy,
      #    not from this mount. See examples/models.md.
      - ${PI_CONFIG_DIR:-${HOME}/.pi}:/root/.pi
      # Give the agent a workspace that survives restarts. Mount your repos here:
      # - /srv/repos:/repos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8081/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    <<: *laun-image
    command: ["bun", "apps/gateway/src/index.ts"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      # Human-facing key for the CLI and browser UI. The gateway hashes it on
      # boot; it never reaches session files or logs.
      LAUN_KEY: ${LAUN_KEY:-}
      EXECUTOR_URL: http://executor:8081
      DATA_DIR: /data
    volumes:
      - laun-data:/data
    depends_on:
      executor:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-bridge:
    <<: *laun-image
    command: ["bun", "apps/telegram-bridge/src/index.ts"]
    environment:
      # Empty or placeholder = log one line and exit 0 (disabled-by-default).
      # Intentionally `:-`, not `:?`: a missing token must be a clean exit,
      # not a compose error, and `on-failure` below must not restart exit 0.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWLIST_IDS: ${TELEGRAM_ALLOWLIST_IDS:?set TELEGRAM_ALLOWLIST_IDS in .env}
      GATEWAY_URL: http://gateway:8080
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      BRIDGE_POLL_MS: ${BRIDGE_POLL_MS:-2000}
    depends_on:
      gateway:
        condition: service_started
    # Restart on crashes, but NOT on a clean exit 0 (disabled-by-default).
    # `unless-stopped` would restart-loop a deliberately-disabled bridge.
    restart: on-failure

  # TLS front door (optional upgrade path; tunnel stays the default).
  # Uncomment to let Caddy terminate HTTPS and proxy ONLY the gateway.
  # Requires DOMAIN + ACME_EMAIL in .env; see deploy/tls.md. The executor
  # (:8081) has no route here and stays loopback-only.
  # caddy:
  #   image: caddy:2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     DOMAIN: ${DOMAIN:?set DOMAIN in .env to enable TLS}
  #     ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env to enable TLS}
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     gateway:
  #       condition: service_started
  #   restart: unless-stopped

  # Pull-only: the OpenShell sandbox image is launched by the executor through
  # the host Docker socket, never by compose. `docker compose --profile sandbox
  # pull` fetches it alongside the stack when OPENSHELL_ENABLED=true.
  pi-agent:
    image: ${OPENSHELL_SANDBOX_IMAGE:-ghcr.io/swarnimarun/laun-pi-agent:${LAUN_TAG:-latest}}
    profiles: ["sandbox"]
    entrypoint: ["/bin/true"]
    restart: "no"

volumes:
  laun-data:
