# One comprehensive image for every service: either pulled from GHCR
# (LAUN_TAG=0.1.0) or built from this checkout (`up -d --build`). Both paths
# tag the same reference, so service config never changes between them.
# See docs/releases.md.
x-laun-image: &laun-image
  image: ${LAUN_SERVICE_IMAGE:-${LAUN_IMAGE:-ghcr.io/swarnimarun/laun}:${LAUN_TAG:-latest}}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 30s

services:
  executor:
    <<: *laun-image
    profiles: ["legacy"]
    command: ["bun", "apps/executor/src/index.ts"]
    ports:
      # Host probes only; gateway traffic uses the compose network.
      - "127.0.0.1:${EXECUTOR_PORT:-8081}:8081"
    environment:
      EXECUTOR_PORT: 8081
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SESSION_DIR: /data/sessions
      PI_BIN: ${PI_BIN:-pi}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-600000}
      # Executor runtime:
      #   json = one pi process per message (proven, the fallback)
      #   rpc  = one long-lived pi child per session: steer, abort, auto-retry
      EXECUTOR_MODE: ${EXECUTOR_MODE:-json}
      RPC_IDLE_TTL_MS: ${RPC_IDLE_TTL_MS:-300000}
      # Local trusted development only. The OpenShell overlay supplies all
      # sandbox/transport settings when isolation is explicitly enabled.
      OPENSHELL_ENABLED: ${OPENSHELL_ENABLED:-false}
    volumes:
      - ${LAUN_DATA_DIR:-laun-data}:/data
      # pi's config + credentials. Two traps avoided deliberately:
      #  * the source must be the INVOKING USER's home — compose is started under
      #    sudo by deploy/bootstrap.sh, where HOME=/root would silently bind an
      #    empty /root/.pi instead of the operator's pi login;
      #  * it must be writable: pi creates ~/.pi/agent and refreshes model
      #    availability on every run. Confinement comes from OpenShell policy,
      #    not from this mount. See examples/models.md.
      - ${PI_CONFIG_DIR:-${HOME}/.pi}:/root/.pi
      # Give the agent a workspace that survives restarts. Mount your repos here:
      # - /srv/repos:/repos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8081/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    <<: *laun-image
    command: ["bun", "apps/gateway/src/index.ts"]
    ports:
      # Use an SSH tunnel or the optional TLS proxy for remote access.
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      # Listen on the compose network; host publishing remains loopback-only.
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      # Human-facing key for the CLI and browser UI. The gateway hashes it on
      # boot; it never reaches session files or logs.
      LAUN_KEY: ${LAUN_KEY:-}
      EXECUTOR_URL: http://executor:8081
      DATA_DIR: /data
      # V2 execution is an explicit trust choice. Production overlay enables
      # OpenShell; source/local developers may opt into trusted host tools.
      OPENSHELL_ENABLED: ${OPENSHELL_ENABLED:-false}
      LAUN_TRUSTED_LOCAL: ${LAUN_TRUSTED_LOCAL:-false}
      LAUN_LEGACY_API: ${LAUN_LEGACY_API:-false}
      LAUN_DEMO: ${LAUN_DEMO:-false}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      LAUN_LOCAL_CAPACITY: ${LAUN_LOCAL_CAPACITY:-2}
      MAX_FAMILY_TOKENS: ${MAX_FAMILY_TOKENS:-100000}
      LAUN_MIN_FREE_DISK_MIB: ${LAUN_MIN_FREE_DISK_MIB:-512}
      LAUN_MCP_ALLOW_LOOPBACK: ${LAUN_MCP_ALLOW_LOOPBACK:-false}
      LAUN_TELEGRAM_BOT_ID: ${LAUN_TELEGRAM_BOT_ID:-}
      TELEGRAM_ALLOWLIST_IDS: ${TELEGRAM_ALLOWLIST_IDS:-}
      TELEGRAM_ALLOWLIST_CHAT_IDS: ${TELEGRAM_ALLOWLIST_CHAT_IDS:-}
      LAUN_TELEGRAM_BRIDGE_TOKEN: ${LAUN_TELEGRAM_BRIDGE_TOKEN:-}
      PI_AUTH_FILE: /controller-auth/auth.json
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      MAX_SESSION_TOKENS: ${MAX_SESSION_TOKENS:-0}
      AUTO_RESUME: ${AUTO_RESUME:-true}
      AUTO_RESUME_MAX_AGE_MS: ${AUTO_RESUME_MAX_AGE_MS:-86400000}
      RUN_STALL_MS: ${RUN_STALL_MS:-2700000}
    volumes:
      - ${LAUN_DATA_DIR:-laun-data}:/data
      # Controller-side inference also serves remote yards without local tools.
      # Keep this dedicated directory outside every sandbox/workspace.
      - type: bind
        source: ${PI_CONTROLLER_AUTH_DIR:-${HOME}/.pi/agent}
        target: /controller-auth
        read_only: false
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-bridge:
    <<: *laun-image
    command: ["bun", "apps/telegram-bridge/src/index.ts"]
    environment:
      # Empty or placeholder = log one line and exit 0 (disabled-by-default).
      # Intentionally `:-`, not `:?`: a missing token must be a clean exit,
      # not a compose error, and `on-failure` below must not restart exit 0.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWLIST_IDS: ${TELEGRAM_ALLOWLIST_IDS:-}
      TELEGRAM_ALLOWLIST_CHAT_IDS: ${TELEGRAM_ALLOWLIST_CHAT_IDS:-}
      LAUN_CONTROL_V2: ${LAUN_CONTROL_V2:-true}
      LAUN_TELEGRAM_BRIDGE_TOKEN: ${LAUN_TELEGRAM_BRIDGE_TOKEN:-}
      BRIDGE_INBOX_KEY: ${BRIDGE_INBOX_KEY:-}
      BRIDGE_DATA_DIR: /bridge-data
      GATEWAY_URL: http://gateway:8080
      GATEWAY_TOKEN: ${LAUN_TELEGRAM_BRIDGE_TOKEN:-${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}}
      MODEL: ${MODEL:-opencode-go/muse-spark-1.3-contributor}
      BRIDGE_POLL_MS: ${BRIDGE_POLL_MS:-2000}
    depends_on:
      gateway:
        condition: service_started
    volumes:
      # Encrypted connector inbox/outbox and routing offsets must never enter
      # executor workspaces or the gateway's agent-readable data volume.
      - laun-bridge-data:/bridge-data
    # Restart on crashes, but NOT on a clean exit 0 (disabled-by-default).
    # `unless-stopped` would restart-loop a deliberately-disabled bridge.
    restart: on-failure

  # TLS front door (optional upgrade path; tunnel stays the default).
  # Uncomment to let Caddy terminate HTTPS and proxy ONLY the gateway.
  # Requires DOMAIN + ACME_EMAIL in .env; see deploy/tls.md. The executor
  # (:8081) has no route here and stays loopback-only.
  # caddy:
  #   image: caddy:2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     DOMAIN: ${DOMAIN:?set DOMAIN in .env to enable TLS}
  #     ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env to enable TLS}
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     gateway:
  #       condition: service_started
  #   restart: unless-stopped

  # Pull-only: the OpenShell sandbox image is launched by the executor through
  # the host Docker socket, never by compose. `docker compose --profile sandbox
  # pull` fetches it alongside the stack when OPENSHELL_ENABLED=true.
  pi-agent:
    image: ${OPENSHELL_SANDBOX_IMAGE:-ghcr.io/swarnimarun/laun-pi-agent:${LAUN_TAG:-latest}}
    profiles: ["sandbox"]
    entrypoint: ["/bin/true"]
    restart: "no"

volumes:
  laun-data:
  laun-bridge-data:
  caddy-data:
  caddy-config:
