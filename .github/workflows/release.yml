# Tag-triggered release: OCI images to GHCR, CLI binaries, GitHub Release.
# Design and runbook: docs/releases.md.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true
        type: string

# Never cancel a release in flight; re-runs target the same tag.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: meta
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a release tag: $tag (expected vX.Y.Z[-prerelease])" >&2
            exit 1
          fi
          version="${tag#v}"
          stable="${version%%-*}"
          pkg="$(jq -r .version package.json)"
          if [ "$version" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'minor=%s\n' "${stable%.*}"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'image_prefix=%s\n' "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}"
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Full source acceptance before publication
        run: bun run test
      - run: bun test scripts/qualify-packaged-control.test.ts
      - name: Install the workspace-pinned browser
        run: bun apps/gateway/node_modules/playwright/cli.js install --with-deps chromium
      - name: Authenticated v2 browser workflows
        run: bun run test:ui
      - name: Responsive Chromium layout regressions
        run: bun run test:design
      - uses: docker/setup-buildx-action@v3
      - name: Synthetic private-state container context boundary
        run: bun scripts/check-container-context.ts
      - name: Build the packaged candidate without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: localhost/laun-release-qualification:candidate
          cache-from: type=gha,scope=laun-amd64
          provenance: false
          sbom: false
      - name: Authenticated packaged v2 durability and restart qualification
        env:
          LAUN_SMOKE_IMAGE: localhost/laun-release-qualification:candidate
        run: bun scripts/qualify-packaged-control.ts

  images:
    needs: verify
    # Native runners, no QEMU: ubuntu-24.04-arm is available for public repos.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          # Comprehensive service image (gateway + executor + telegram-bridge).
          - name: laun
            dockerfile: deploy/Dockerfile
          # OpenShell sandbox image, launched by the executor, not by compose.
          - name: laun-pi-agent
            dockerfile: deploy/openshell/Dockerfile.pi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.verify.outputs.image_prefix }}/${{ matrix.image.name }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ needs.verify.outputs.revision }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          # Attestations would have to survive the imagetools merge below;
          # turn both on when that is set up. See docs/releases.md follow-ups.
          provenance: false
          sbom: false

  merge:
    needs: [verify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [laun, laun-pi-agent]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join per-arch manifests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MINOR: ${{ needs.verify.outputs.minor }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          img="${{ needs.verify.outputs.image_prefix }}/${{ matrix.image }}"
          tags=(-t "$img:$VERSION")
          # Floating tags only point at stable releases; a prerelease must
          # never move `X.Y` or `latest`.
          if [ "$PRERELEASE" = "false" ]; then
            tags+=(-t "$img:$MINOR" -t "$img:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$img:$VERSION-amd64" "$img:$VERSION-arm64"

  smoke:
    needs: [verify, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualify the published packaged v2 controller
        env:
          LAUN_SMOKE_IMAGE: ${{ needs.verify.outputs.image_prefix }}/laun:${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$LAUN_SMOKE_IMAGE"
          bun scripts/qualify-packaged-control.ts

  cli:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64,    os: linux,  arch: amd64 }
          - { target: bun-linux-arm64,  os: linux,  arch: arm64 }
          - { target: bun-darwin-x64,   os: darwin, arch: amd64 }
          - { target: bun-darwin-arm64, os: darwin, arch: arm64 }
          - { target: bun-windows-x64,  os: windows, arch: amd64, ext: .exe }
    env:
      LAUN_VERSION: ${{ needs.verify.outputs.version }}
      LAUN_SOURCE_REVISION: ${{ needs.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile
        run: |
          set -euo pipefail
          mkdir -p dist
          bun scripts/build-cli.ts --target=${{ matrix.target }} \
            --version "$LAUN_VERSION" --outfile "dist/laun${{ matrix.ext }}"
      - name: Check reported version
        if: matrix.target == 'bun-linux-x64'
        run: ./dist/laun --version | grep -qx "laun $LAUN_VERSION"
      - name: Package
        run: |
          set -euo pipefail
          name="laun_${LAUN_VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          cd dist
          cp "laun${{ matrix.ext }}.manifest.json" "../${name}.manifest.json"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "../${name}.zip" "laun.exe"
          else
            tar -czf "../${name}.tar.gz" laun
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            laun_*.tar.gz
            laun_*.zip
            laun_*.manifest.json
          if-no-files-found: error

  release:
    needs: [verify, smoke, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum laun_* > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          REVISION: ${{ needs.verify.outputs.revision }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag_revision="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          tag_type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)"
          if [ "$tag_type" = "tag" ]; then
            tag_revision="$(gh api "repos/$GH_REPO/git/tags/$tag_revision" --jq .object.sha)"
          fi
          test "$tag_revision" = "$REVISION"
          flags=(--title "laun $TAG" --target "$REVISION" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$REVISION" --jq .body > "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" "${flags[@]}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" artifacts/* "${flags[@]}" --generate-notes
          fi
