name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      # Use the scoped script: a bare `bun test` also picks up compiled dist/
      # copies and runs the whole suite twice.
      - run: bun run test
      - run: bun test scripts/qualify-packaged-control.test.ts
      - name: Install the workspace-pinned browser
        run: bun apps/gateway/node_modules/playwright/cli.js install --with-deps chromium
      - name: Authenticated v2 browser workflows
        run: bun run test:ui
      - name: Responsive Chromium layout regressions
        run: bun run test:design
      - name: Synthetic private-state container context boundary
        run: |
          docker info >/dev/null
          bun scripts/check-container-context.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build the unpublished controller candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: localhost/laun-release-qualification:candidate
          cache-from: type=gha,scope=laun-ci-amd64
          cache-to: type=gha,scope=laun-ci-amd64,mode=max
          provenance: false
          sbom: false
      - name: Authenticated packaged v2 durability and restart qualification
        env:
          LAUN_SMOKE_IMAGE: localhost/laun-release-qualification:candidate
        run: bun scripts/qualify-packaged-control.ts
